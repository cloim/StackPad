# Unit tests, translation coverage and the web build on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # Tests compare Korean source messages; the runner's Windows language is English.
      STACKPAD_LANG: ko
      # Fixtures print Korean and compare full paths; avoid the runner's cp1252 console and 8.3 short temp path.
      PYTHONUTF8: '1'
    steps:
      - name: Use the runner temp folder, which has no 8.3 short name
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements-lock.txt
      - run: npm ci
      - run: npm run build
      - run: node scripts/i18n-check.mjs
      - run: python -m unittest discover tests
