# Push a tag like v1.2.3 to build the Windows installer, portable zip, updater files and the Android APK,
# then publish them together as one GitHub release.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match package.json $version" }
      - run: pip install -r requirements-lock.txt
      - run: npm ci
      - name: Build installer and portable app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/build.py --installer --release-dir out/StackPad
      - name: Write the updater manifest
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $setup = "StackPad_${version}_x64-setup.exe"
          $manifest = @{
            version = $version
            notes = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{
              signature = (Get-Content "out/$setup.sig" -Raw).Trim()
              url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$setup"
            } }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content out/latest.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/StackPad_*_x64-setup.exe
            out/StackPad_*_x64-setup.exe.sig
            out/StackPad-Windows-x64-portable.zip
            out/latest.json

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - name: Build the signed APK
        env:
          STACKPAD_KEYSTORE_BASE64: ${{ secrets.STACKPAD_KEYSTORE_BASE64 }}
          STACKPAD_KEYSTORE_PASSWORD: ${{ secrets.STACKPAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$STACKPAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stackpad.jks"
          chmod +x android/gradlew
          STACKPAD_KEYSTORE="$RUNNER_TEMP/stackpad.jks" python3 scripts/build-android.py --out out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/StackPad.apk }

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "StackPad ${GITHUB_REF_NAME#v}" --generate-notes
