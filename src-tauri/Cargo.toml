[package]
name = "stackpad"
version = "1.1.14"
description = "Local service pad controller"
edition = "2021"
default-run = "stackpad"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
sys-locale = "0.3"
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
